rvas.',img:PH+'photo-1514933651103-005eec06c04b?auto=format&fit=crop&w=900&q=80'}]},

// Quando os restaurantes ficam muito perto das visitas, afastar visualmente
// apenas os ícones, mantendo coordenadas reais nas direções GPS.
let foodGuideLines=[];
function separateFoodMarkers(){
 foodGuideLines.forEach(line=>map.removeLayer(line));foodGuideLines=[];
 const d=days.find(x=>x.id===active),eats=restaurants[active]||[];
 if(!document.getElementById('foodBtn').classList.contains('active')&&!eats.length)return;
 const taken=d.points.map(p=>map.latLngToLayerPoint([p.lat,p.lng]));
 eats.forEach((r,i)=>{
  const marker=markers[d.points.length+i];if(!marker)return;
  const original=map.latLngToLayerPoint([r.lat,r.lng]);
  let chosen=original;
  const free=pt=>taken.every(q=>pt.distanceTo(q)>=43);
  if(!free(chosen)){
   for(const radius of [52,70,90,110,135]){
    for(let j=0;j<16;j++){
     const angle=(j*2*Math.PI/16)+(i*.37);
     const pt=L.point(original.x+radius*Math.cos(angle),original.y+radius*Math.sin(angle));
     if(free(pt)){chosen=pt;break}
    }
    if(free(chosen))break;
   }
  }
  taken.push(chosen);
  const visual=map.layerPointToLatLng(chosen);
  marker.setLatLng(visual);
  if(chosen.distanceTo(original)>5){
   const guide=L.polyline([[r.lat,r.lng],visual],{color:'#e18c2e',weight:2,opacity:.75,dashArray:'3 5',interactive:false}).addTo(map);
   foodGuideLines.push(guide);
  }
 });
}
