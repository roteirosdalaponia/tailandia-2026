const map=L.map('map',{zoomControl:true}).setView([64,25],5);const normal=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri'});const terrain=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'&copy; OpenTopoMap / OpenStreetMap'});L.control.layers({'🗺️ Normal':normal,'🛰️ Satélite':satellite,'⛰️ Terreno':terrain},null,{position:'topright',collapsed:false}).addTo(map);L.control.locate=null;let gpsMarker=null;const gpsControl=L.control({position:'bottomright'});gpsControl.onAdd=function(){const b=L.DomUtil.create('button');b.textContent='📍 A minha localização';b.title='Mostrar localização GPS';b.style.cssText='background:white;border:2px solid #ccc;border-radius:9px;padding:10px;cursor:pointer;font-weight:700;box-shadow:0 2px 8px #0002';L.DomEvent.disableClickPropagation(b);L.DomEvent.on(b,'click',()=>{if(!navigator.geolocation){alert('GPS não disponível neste navegador.');return}navigator.geolocation.getCurrentPosition(pos=>{const c=[pos.coords.latitude,pos.coords.longitude];if(gpsMarker)map.removeLayer(gpsMarker);gpsMarker=L.circleMarker(c,{radius:9,color:'#0758bd',fillColor:'#0d6fe8',fillOpacity:.9}).addTo(map).bindPopup('📍 A tua localização');map.setView(c,15);gpsMarker.openPopup()},()=>alert('Não foi possível obter a localização. Verifica as permissões do navegador.'),{enableHighAccuracy:true,timeout:15000})});return b};gpsControl.addTo(map);let active=1,markers=[],route=null;

// Apenas fotografias associadas a artigos específicos dos próprios locais; sem pesquisa automática aleatória.
const exactWikiPages={'Catedral Uspenski':'Uspenski_Cathedral','Catedral de Helsínquia e Praça do Senado':'Helsinki_Cathedral','Igreja Temppeliaukio':'Temppeliaukio_Church','Biblioteca Oodi':'Helsinki_Central_Library_Oodi','Arktikum':'Arktikum','Santa Claus Village':'Santa_Claus_Village','Aeroporto de Helsínquia':'Helsinki_Airport','Aeroporto de Rovaniemi':'Rovaniemi_Airport'};const exactPhotoCache=new Map();function photoForPlace(name,fallback){const page=exactWikiPages[name];if(!page)return Promise.resolve(fallback);if(exactPhotoCache.has(name))return exactPhotoCache.get(name);const p=(async()=>{try{const u='https://en.wikipedia.org/w/api.php?origin=*&action=query&titles='+encodeURIComponent(page)+'&prop=pageimages&piprop=thumbnail&pithumbsize=900&format=json';const res=await fetch(u);if(!res.ok)return fallback;const data=await res.json();return Object.values(data.query?.pages||{})[0]?.thumbnail?.source||fallback}catch(e){return fallback}})();exactPhotoCache.set(name,p);return p;}function updatePlacePhotos(root=document){root.querySelectorAll('img[data-place]').forEach(async el=>{const name=decodeURIComponent(el.dataset.place);const original=el.getAttribute('src');const url=await photoForPlace(name,original);if(el.isConnected&&url!==original){el.onerror=()=>{el.onerror=null;el.src=original};el.src=url}})}
const directions=p=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.address||`${p.lat},${p.lng}`);function pin(n){return L.divIcon({className:'',html:`<div class="marker-pin"><span>${n}</span></div>`,iconSize:[42,42],iconAnchor:[21,38],popupAnchor:[0,-34]})}function foodPin(){return L.divIcon({className:'',html:'<div class="food-pin"><span>🍴</span></div>',iconSize:[38,38],iconAnchor:[19,34],popupAnchor:[0,-30]})}function popup(p){return `<img class="popup-photo" data-place="${encodeURIComponent(p.name)}" src="${p.img||img.bangkok}" alt="${p.name}" onerror="this.style.display='none'"><div class="popup-info"><div class="popup-title"><span class="popup-num">${p.n||'•'}</span><b>${p.name}</b></div><p>${p.d||''}${p.budget?`<br><b>${p.budget}</b>`:''}</p><a class="go" target="_blank" rel="noopener" href="${directions(p)}">📍 Direções</a></div>`}map.on('popupopen',e=>updatePlacePhotos(e.popup.getElement()));function clearMap(){markers.forEach(m=>map.removeLayer(m));markers=[];if(route){map.removeLayer(route);route=null}}function clearTop(){document.querySelectorAll('.legend button').forEach(b=>b.classList.remove('active'))}
function renderDays(){const nav=document.getElementById('days');nav.innerHTML='';document.getElementById('prevDay').disabled=active<=1;document.getElementById('nextDay').disabled=active>=days.length;days.forEach(d=>{const b=document.createElement('button');b.className=d.id===active?'active':'';b.innerHTML=`<span class="cal">▣</span><span><span class="date">${d.date}</span><span class="weekday">${d.weekday}</span></span>`;b.onclick=()=>{clearTop();active=d.id;renderDays();renderDay()};nav.appendChild(b)});const selected=nav.querySelector('button.active');if(selected){nav.scrollTo({left:Math.max(0,selected.offsetLeft-nav.offsetLeft-nav.clientWidth/2+selected.clientWidth/2),behavior:'smooth'})}}
function changeDay(delta){const next=active+delta;if(next<1||next>days.length)return;clearTop();active=next;renderDays();renderDay()}document.getElementById('prevDay').onclick=()=>changeDay(-1);document.getElementById('nextDay').onclick=()=>changeDay(1);function renderDay(showFood=false){foodGuideLines.forEach(line=>map.removeLayer(line));foodGuideLines=[];const d=days.find(x=>x.id===active);clearMap();let html=`<div class="dayhead"><div class="big">${d.date}</div><h2>${d.weekday}</h2><p><b>${d.title}</b><br>${d.description}</p></div>`;if(d.hotel!=null){const h=hotels[d.hotel];html+=`<div class="hotel"><span class="type-icon">🏨</span><span><b>${h.name}</b><small>${h.address}</small></span></div>`}const coords=[];d.points.forEach((p,i)=>{const m=L.marker([p.lat,p.lng],{icon:pin(p.n),zIndexOffset:1000}).addTo(map).bindPopup(popup(p),{maxWidth:300});markers.push(m);coords.push([p.lat,p.lng]);html+=`<div class="stop" data-i="${i}"><span class="badge">${p.n}</span><img class="stop-thumb" data-place="${encodeURIComponent(p.name)}" src="${p.img}" alt="" onerror="this.style.visibility='hidden'"><span><span class="stopname">${p.name}</span><span class="stoptxt">${p.d}</span></span><span class="chev">›</span></div>`});const eats=showFood?(restaurants[active]||[]):[];if(eats.length){html+=`<div class="food-section"><div class="food-title">🍴 Onde comer perto do percurso</div><div class="food-note">Sugestões económicas/práticas; preços e horários podem mudar.</div>`;eats.forEach((r,i)=>html+=`<div class="food-stop" data-food="${i}"><img class="food-thumb" data-place="${encodeURIComponent(r.name)}" src="${r.img}" alt=""><span class="food-copy"><b>${r.name}</b><small>${r.budget} · ${r.d}</small></span></div>`);html+='</div>'}html+=`<div class="credit">Roteiro preparado para um casal. Valores de entrada indicados por pessoa e sujeitos a alteração. As linhas no mapa mostram apenas a sequência do dia, não uma rota de transporte.</div>`;document.getElementById('content').innerHTML=html;updatePlacePhotos(document.getElementById('content'));if(coords.length>1){route=L.polyline(coords,{color:'#1479e8',weight:3,opacity:.4,dashArray:'7 9'}).addTo(map);map.fitBounds(L.latLngBounds(coords),{padding:[55,55],maxZoom:13})}else if(coords.length)map.setView(coords[0],14);document.querySelectorAll('.stop').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;map.flyTo(coords[i],15,{duration:.5});setTimeout(()=>markers[i].openPopup(),280)});eats.forEach((r,i)=>{const q={...r,n:'🍴'};const fm=L.marker([r.lat,r.lng],{icon:foodPin()}).addTo(map).bindPopup(popup(q));markers.push(fm);document.querySelector(`[data-food="${i}"]`)?.addEventListener('click',()=>{map.flyTo([r.lat,r.lng],16);setTimeout(()=>fm.openPopup(),250)})});if(showFood)separateFoodMarkers();setTimeout(()=>map.invalidateSize(),100)}

// Quando os restaurantes ficam muito perto das visitas, afastar visualmente
// apenas os ícones, mantendo coordenadas reais nas direções GPS.
let foodGuideLines=[];
function separateFoodMarkers(){
 foodGuideLines.forEach(line=>map.removeLayer(line));foodGuideLines=[];
 const d=days.find(x=>x.id===active),eats=restaurants[active]||[];
 if(!document.getElementById('foodBtn').classList.contains('active')&&!eats.length)return;
 const taken=d.points.map(p=>map.latLngToLayerPoint([p.lat,p.lng]));
 eats.forEach((r,i)=>{
  const marker=markers[d.points.length+i];if(!marker)return;
  const original=map.latLngToLayerPoint([r.lat,r.lng]);
  let chosen=original;
  const free=pt=>taken.every(q=>pt.distanceTo(q)>=43);
  if(!free(chosen)){
   for(const radius of [52,70,90,110,135]){
    for(let j=0;j<16;j++){
     const angle=(j*2*Math.PI/16)+(i*.37);
     const pt=L.point(original.x+radius*Math.cos(angle),original.y+radius*Math.sin(angle));
     if(free(pt)){chosen=pt;break}
    }
    if(free(chosen))break;
   }
  }
  taken.push(chosen);
  const visual=map.layerPointToLatLng(chosen);
  marker.setLatLng(visual);
  if(chosen.distanceTo(original)>5){
   const guide=L.polyline([[r.lat,r.lng],visual],{color:'#e18c2e',weight:2,opacity:.75,dashArray:'3 5',interactive:false}).addTo(map);
   foodGuideLines.push(guide);
  }
 });
}
map.on('zoomend',()=>{if(document.getElementById('foodBtn')?.classList.contains('active'))separateFoodMarkers()});
function showAll(kind){
 if(kind==='food'){
  const wasActive=document.getElementById('foodBtn').classList.contains('active');
  clearTop();
  renderDay(!wasActive);
  if(!wasActive){
   document.getElementById('foodBtn').classList.add('active');separateFoodMarkers();
   const pts=[...days.find(d=>d.id===active).points,...(restaurants[active]||[])];
   if(pts.length)map.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])),{padding:[55,55],maxZoom:15});
   const eatCount=(restaurants[active]||[]).length;
   // Não abrir automaticamente um popup que possa tapar os pontos de visita.
  }
  return;
 }
 clearTop();clearMap();const btn=document.getElementById(kind+'Btn');if(btn)btn.classList.add('active');let pts=[];if(kind==='hotel'){
 const today=days.find(d=>d.id===active);
 const h=hotels[today.hotel];
 if(h){
  // Manter os pontos numerados do dia e acrescentar apenas o hotel.
  renderDay();
  const hotel={...h,n:'🏨',d:'Hotel correspondente ao dia '+today.date+'. Toque em Direções para iniciar a navegação GPS.'};
  const marker=L.marker([h.lat,h.lng],{icon:pin('H')}).addTo(map).bindPopup(popup(hotel));
  markers.push(marker);
  const coords=[...today.points.map(p=>[p.lat,p.lng]),[h.lat,h.lng]];
  map.fitBounds(L.latLngBounds(coords),{padding:[55,55],maxZoom:15});
  marker.openPopup();
  document.getElementById('hotelBtn').classList.add('active');
  return;
 }
 pts=[];
}if(kind==='airport'){
 const d=days.find(x=>x.id===active);
 const dayAirports=d.points.filter(p=>/aeroporto/i.test(p.name));
 pts=dayAirports.map(p=>({...p,n:'✈'}));
 if(!pts.length){const byDay={1:[0],3:[0,1],6:[1]};pts=(byDay[active]||[]).map(i=>({...airports[i],n:'✈',d:'Aeroporto associado à viagem deste dia.',img:img.bangkok}));}
}
if(kind==='visits')pts=days.find(d=>d.id===active).points.filter(p=>!/hotel|aeroporto/i.test(p.name));if(kind==='food')pts=(restaurants[active]||[]).map(p=>({...p,n:'🍴'}));const cs=[];pts.forEach(p=>{const m=L.marker([p.lat,p.lng],{icon:kind==='food'?foodPin():pin(p.n)}).addTo(map).bindPopup(popup(p));markers.push(m);cs.push([p.lat,p.lng]);if(kind==='airport'&&pts.length===1){map.setView([p.lat,p.lng],15);m.openPopup();}});if(cs.length&&!(kind==='airport'&&pts.length===1))map.fitBounds(L.latLngBounds(cs),{padding:[50,50],maxZoom:15});else if(kind==='food'){alert('Ainda não existem restaurantes registados para este dia.');renderDay();clearTop()}else if(kind==='airport'){alert('Este dia não tem aeroporto no percurso.');renderDay();clearTop()}}
document.getElementById('hotelBtn').onclick=()=>showAll('hotel');document.getElementById('foodBtn').onclick=()=>showAll('food');document.getElementById('visitsBtn').onclick=()=>showAll('visits');document.getElementById('airportBtn').onclick=()=>showAll('airport');renderDays();renderDay();
